name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build and test in the development container
        uses: devcontainers/ci@v0.3
        with:
          runCmd: make test
          push: never
